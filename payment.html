<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Donate – CCAvenue | Rebotics Medical & Education Trust</title>
  <style>
    body{font-family:Inter,system-ui;margin:0;padding:0;background:#f1f5f9;color:#0f172a}
    .wrapper{max-width:600px;margin:40px auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.08)}
    h2{text-align:center;color:#0b6b6b;margin-top:0}
    .btn{display:block;width:100%;padding:14px 20px;background:#0b6b6b;color:#fff;text-align:center;font-weight:700;border-radius:8px;text-decoration:none;margin-top:20px;border:none}
    .note{font-size:0.9rem;color:#475569;margin-top:12px;text-align:center}
    label{display:block;margin-top:10px}
    input[type=text], input[type=number]{width:100%;padding:10px;margin-top:6px;border-radius:6px;border:1px solid #d1d5db}
  </style>
</head>
<body>
  <div class="wrapper">
    <h2>Donate Securely via CCAvenue</h2>
    <p>Your contribution helps us expand medical education, healthcare access, and community health programs.</p>

    <!-- Simple form to collect donor details and amount. Replace action with your server-side integration if needed -->
    <form method="post" action="https://secure.ccavenue.com/transaction/transaction.do?command=initiateTransaction" onsubmit="return prepare();">
      <label>Donor Name
        <input type="text" name="billing_name" id="billing_name" required>
      </label>
      <label>Email
        <input type="text" name="billing_email" id="billing_email" required>
      </label>
      <label>Amount (INR)
        <input type="number" name="amount" id="amount" min="1" value="100" required>
      </label>

      <!-- Hidden fields required by CCAvenue (example placeholders) -->
      <input type="hidden" name="merchant_id" id="merchant_id" value="YOUR_MERCHANT_ID">
      <input type="hidden" name="order_id" id="order_id" value="ORDER12345">
      <input type="hidden" name="redirect_url" value="https://www.reboticsmedicaltrust.com/payment-success.html">
      <input type="hidden" name="cancel_url" value="https://www.reboticsmedicaltrust.com/payment-failed.html">

      <button type="submit" class="btn">Proceed to Secure Payment</button>
    </form>

    <div class="note">You'll be redirected to CCAvenue’s secure payment gateway. Replace <code>YOUR_MERCHANT_ID</code> and integrate server-side checksum generation per CCAvenue docs.</div>
  </div>

  <script>
    function prepare(){
      // generate a simple order id using timestamp (for demo only)
      var oid = 'RB' + Date.now();
      document.getElementById('order_id').value = oid;
      // In production, don't trust client-side; generate order_id and checksum on server.
      return true;
    }
  </script>
</body>
</html>
